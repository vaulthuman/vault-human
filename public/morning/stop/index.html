<style>html,body{margin:0;min-height:100%;background:#1b2230;color:#f6f1e7;font:16px/1.5 Inter,Arial,sans-serif}

fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"stop",id:c})}).catch(function(){}).then(function(){
document.getElementById("a").innerHTML='<h1>You’re unsubscribed.</h1><p style="margin-top:12px">No more morning keys. Thank you for the mornings you gave it.</p>';});};
